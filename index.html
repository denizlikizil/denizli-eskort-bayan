<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İlan</title>
<!--
  Değiştirilecek yerler:
  1. Fotoğraflar: <img src="..."> adreslerini kendi fotoğraflarınla değiştir. Tek fotoğraf da olur, fazlası yana kayar.
  2. Telefon: tel:+905005527410 ve görünen 0 (500) 552 74 10
  3. WhatsApp: wa.me/905005527410 (başta + ve 0 olmadan, 90 ile)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
:root{--bg:#F4F5F2;--fg:#1B1D1C;--line:#DFE2DC;--ara-alt:#C9CEC9;--onfill:#F7FAF8;--wa:#25D366;--wa-fg:#0B2E1A;--odak:#0B7A55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.55 'Bricolage Grotesque',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--odak);outline-offset:2px}
.kap{max-width:720px;margin:0 auto;padding:16px}
.galeri{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;border-radius:20px}
.galeri::-webkit-scrollbar{display:none}
.galeri img{display:block;flex:none;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;background:var(--line)}
.ipucu{margin:6px 0 0;font-size:.8125rem;color:#545955;text-align:center}
.iletisim{display:grid;gap:12px;margin-top:16px}
.ara,.wa{display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:18px;-webkit-tap-highlight-color:transparent}
.ara:active,.wa:active{transform:scale(.98)}
.ara{min-height:72px;background:var(--fg);color:var(--onfill)}
.ara small{display:block;font-size:.8125rem;color:var(--ara-alt)}
.ara b{display:block;font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.wa{min-height:58px;background:var(--wa);color:var(--wa-fg);font-weight:700;font-size:1.0625rem}
svg{flex:none}
@media (hover:hover){.ara:hover b,.wa:hover span{text-decoration:underline;text-underline-offset:.15em}}
</style>
</head>
<body>
<main class="kap">
  <div class="galeri" role="region" aria-label="Fotoğraflar" tabindex="0">
    <img src="https://picsum.photos/seed/ilan-1/1200/900" width="1200" height="900" alt="Fotoğraf 1">
    <img src="https://picsum.photos/seed/ilan-2/1200/900" width="1200" height="900" alt="Fotoğraf 2" loading="lazy">
    <img src="https://picsum.photos/seed/ilan-3/1200/900" width="1200" height="900" alt="Fotoğraf 3" loading="lazy">
  </div>
  <p class="ipucu">Diğer fotoğraflar için yana kaydırın</p>
  <div class="iletisim">
    <a class="ara" href="tel:+905005527410" target="_top"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span><small>Telefonla ara</small><b>0 (500) 552 74 10</b></span></a>
    <a class="wa" href="https://wa.me/905005527410?text=Merhaba%2C%20ilan%C4%B1n%C4%B1z%20i%C3%A7in%20yaz%C4%B1yorum." target="_blank" rel="noopener"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg><span>WhatsApp ile yaz</span></a>
  </div>
</main>
</body>
</html>
